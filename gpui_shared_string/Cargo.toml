# Modified by Longbridge for gpui-fast publication.
[package]
name = "gpui-fast-shared-string"
version = "0.1.12"
publish = ["crates-io"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/feigeCode/gpui-fast"
homepage = "https://github.com/feigeCode/gpui-fast"
readme = "README.md"
documentation = "https://docs.rs/gpui-fast-shared-string/0.1.12/gpui_shared_string/"
description = "gpui_shared_string: GPUI with gpui-fast rendering and layout optimizations"
autoexamples = false
autobenches = false
autotests = false
authors = ["Longbridge"]
include = ["/src/**", "/resources/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
path = "gpui_shared_string.rs"
test = false
doctest = false
name = "gpui_shared_string"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.smol_str]
version = "0.3.6"
default-features = false
features = ["serde"]

[lints.rust.unexpected_cfgs]
level = "allow"
