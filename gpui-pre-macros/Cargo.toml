# Modified by Longbridge for gpui-fast publication.
[package]
name = "gpui-pre-macros"
version = "0.3.126"
license = "Apache-2.0"
edition = "2024"
description = "gpui-fast-macros under the gpui-pre name GPUI Kit pins; forwards to it."
repository = "https://github.com/feigeCode/gpui-fast"

[lib]
name = "gpui_macros"
path = "lib.rs"
doctest = false

[features]
inspector = ["gpui_fast/inspector"]

[dependencies.gpui_fast]
package = "gpui-fast-macros"
path = "../gpui_macros"
default-features = false
