# Modified by Longbridge for gpui-fast publication.
[package]
name = "gpui-pre"
version = "0.3.126"
license = "Apache-2.0"
edition = "2024"
description = "gpui-fast under the gpui-pre name GPUI Kit pins; forwards to it."
repository = "https://github.com/feigeCode/gpui-fast"

[lib]
name = "gpui"
path = "lib.rs"
doctest = false

[features]
bench = ["gpui_fast/bench"]
bench-support = ["gpui_fast/bench-support"]
inspector = ["gpui_fast/inspector"]
leak-detection = ["gpui_fast/leak-detection"]
profiler = ["gpui_fast/profiler"]
screen-capture = ["gpui_fast/screen-capture"]
stacker = ["gpui_fast/stacker"]
test-support = ["gpui_fast/test-support"]
wayland = ["gpui_fast/wayland"]
windows-manifest = ["gpui_fast/windows-manifest"]
x11 = ["gpui_fast/x11"]
default = ["gpui_fast/default"]

[dependencies.gpui_fast]
package = "gpui-fast"
path = "../gpui"
default-features = false
