# Modified by Longbridge for gpui-fast publication.
[package]
name = "path"
version = "0.1.8"
edition = "2024"
publish = ["crates-io"]
license = "Apache-2.0"
repository = "https://github.com/feigeCode/gpui-fast"
homepage = "https://github.com/feigeCode/gpui-fast"
readme = "README.md"
documentation = "https://docs.rs/path/0.1.8/path/"
description = "path: GPUI with gpui-fast rendering and layout optimizations"
autoexamples = false
autobenches = false
autotests = false
authors = ["Longbridge"]
include = ["/src/**", "/resources/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
path = "src/path.rs"
doctest = false
name = "path"

[features]
test-support = []

[dependencies.anyhow]
version = "1.0.86"

[dependencies.dunce]
version = "1.0"

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]
optional = true

[target."cfg(windows)".dependencies.tendril]
version = "0.5"

[lints.rust.unexpected_cfgs]
level = "allow"
