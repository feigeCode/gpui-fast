# Modified by Longbridge for gpui-fast publication.
[package]
name = "bench-metrics"
version = "0.1.12"
edition = "2024"
publish = ["crates-io"]
license = "Apache-2.0"
repository = "https://github.com/feigeCode/gpui-fast"
homepage = "https://github.com/feigeCode/gpui-fast"
readme = "README.md"
documentation = "https://docs.rs/bench-metrics/0.1.12/bench_metrics/"
description = "bench_metrics: GPUI with gpui-fast rendering and layout optimizations"
autoexamples = false
autobenches = false
autotests = false
authors = ["Longbridge"]
include = ["/src/**", "/resources/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
path = "src/bench_metrics.rs"
doctest = false
name = "bench_metrics"

[features]
test-support = []

[dependencies.anyhow]
version = "1.0.86"

[dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]

[target."cfg(unix)".dependencies.libc]
version = "0.2"

[target."cfg(target_os = \"linux\")".dependencies.perf-event]
package = "perf-event2"
version = "0.7.4"

[lints.rust.unexpected_cfgs]
level = "allow"
