# Modified by Longbridge for gpui-fast publication.
[package]
name = "sum-tree"
version = "0.1.12"
edition = "2024"
publish = ["crates-io"]
license = "Apache-2.0"
description = "sum_tree: GPUI with gpui-fast rendering and layout optimizations"
repository = "https://github.com/feigeCode/gpui-fast"
homepage = "https://github.com/feigeCode/gpui-fast"
readme = "README.md"
documentation = "https://docs.rs/sum-tree/0.1.12/sum_tree/"
autoexamples = false
autobenches = false
autotests = false
authors = ["Longbridge"]
include = ["/src/**", "/resources/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
path = "src/sum_tree.rs"
doctest = false
name = "sum_tree"

[dependencies.heapless]
version = "0.9.2"

[dependencies.rayon]
version = "1.8"

[dependencies.ztracing]
package = "ztracing"
version = "^0.1.12"
path = "../ztracing"

[dependencies.tracing]
version = "0.1.40"

[dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]
optional = true

[features]
test-support = ["proptest"]

[lints.rust.unexpected_cfgs]
level = "allow"
