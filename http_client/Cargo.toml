# Modified by Longbridge for gpui-fast publication.
[package]
name = "http-client"
version = "0.1.12"
edition = "2024"
publish = ["crates-io"]
license = "Apache-2.0"
description = "http_client: GPUI with gpui-fast rendering and layout optimizations"
repository = "https://github.com/feigeCode/gpui-fast"
homepage = "https://github.com/feigeCode/gpui-fast"
readme = "README.md"
documentation = "https://docs.rs/http-client/0.1.12/http_client/"
autoexamples = false
autobenches = false
autotests = false
authors = ["Longbridge"]
include = ["/src/**", "/resources/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[features]
test-support = ["dep:log"]

[lib]
path = "src/http_client.rs"
doctest = false
name = "http_client"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.bytes]
version = "1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.http-body]
version = "1.0"

[dependencies.http]
version = "1.1"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]
optional = true

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_urlencoded]
version = "0.7"

[dependencies.url]
version = "2.2"

[target."cfg(not(target_family = \"wasm\"))".dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[target."cfg(not(target_family = \"wasm\"))".dependencies.async-compression]
version = "0.4"
features = ["bzip2", "gzip", "futures-io"]
optional = true

[target."cfg(not(target_family = \"wasm\"))".dependencies.async-fs]
version = "2.1"
optional = true

[target."cfg(not(target_family = \"wasm\"))".dependencies.sha2]
version = "0.10"
optional = true

[target."cfg(not(target_family = \"wasm\"))".dependencies.tempfile]
version = "3.20.0"
optional = true

[lints.rust.unexpected_cfgs]
level = "allow"
