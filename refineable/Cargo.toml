# Modified by Longbridge for gpui-fast publication.
[package]
name = "refineable"
version = "0.1.12"
edition = "2024"
publish = ["crates-io"]
license = "Apache-2.0"
description = "refineable: GPUI with gpui-fast rendering and layout optimizations"
repository = "https://github.com/feigeCode/gpui-fast"
homepage = "https://github.com/feigeCode/gpui-fast"
readme = "README.md"
documentation = "https://docs.rs/refineable/0.1.12/refineable/"
autoexamples = false
autobenches = false
autotests = false
authors = ["Longbridge"]
include = ["/src/**", "/resources/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
path = "src/refineable.rs"
doctest = false
test = false
name = "refineable"

[dependencies.derive_refineable]
package = "derive-refineable"
version = "^0.1.12"
path = "../refineable/derive_refineable"

[lints.rust.unexpected_cfgs]
level = "allow"
