# Modified by Longbridge for gpui-fast publication.
[package]
name = "gpui-pre-platform"
version = "0.3.126"
license = "Apache-2.0"
edition = "2024"
description = "gpui-fast-platform under the gpui-pre name GPUI Kit pins; forwards to it."
repository = "https://github.com/feigeCode/gpui-fast"

[lib]
name = "gpui_platform"
path = "lib.rs"
doctest = false

[features]
bench-support = ["gpui_fast/bench-support"]
font-kit = ["gpui_fast/font-kit"]
runtime_shaders = ["gpui_fast/runtime_shaders"]
screen-capture = ["gpui_fast/screen-capture"]
test-support = ["gpui_fast/test-support"]
wayland = ["gpui_fast/wayland"]
x11 = ["gpui_fast/x11"]
default = ["gpui_fast/default"]

[dependencies.gpui_fast]
package = "gpui-fast-platform"
path = "../gpui_platform"
default-features = false
